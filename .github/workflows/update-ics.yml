name: Update ICS

on:
  repository_dispatch:
    types: [update_ics]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Daily Availability.ics
        env:
          ICS_URL: ${{ github.event.client_payload.ics_url }}
        run: |
          curl -L -A "Mozilla/5.0" "$ICS_URL" -o "Daily Availability.ics"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Daily Availability.ics"
          git rm --cached availability.ics 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Daily Availability ICS"
          git push
