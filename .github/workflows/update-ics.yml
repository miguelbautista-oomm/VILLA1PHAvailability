name: Update ICS

on:
  repository_dispatch:
    types: [update_ics]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ics
  queue: max
  cancel-in-progress: false

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save chunk
        env:
          CHUNK: ${{ github.event.client_payload.chunk }}
          CHUNK_INDEX: ${{ github.event.client_payload.chunk_index }}
        run: |
          mkdir -p chunks
          printf '%s' "$CHUNK" > "chunks/${CHUNK_INDEX}.txt"

      - name: Commit chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunks/
          git diff --cached --quiet || git commit -m "Add ICS chunk"
          git push
