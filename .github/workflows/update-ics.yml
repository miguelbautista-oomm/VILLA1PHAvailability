name: Update ICS

on:
  repository_dispatch:
    types: [update_ics]

permissions:
  contents: write

jobs:
  save-chunk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save chunk
        env:
          CHUNK: ${{ github.event.client_payload.chunk }}
          CHUNK_INDEX: ${{ github.event.client_payload.chunk_index }}
          UPDATE_ID: ${{ github.event.client_payload.update_id }}
          TOTAL_CHUNKS: ${{ github.event.client_payload.total_chunks }}
        run: |
          BRANCH="ics-chunk/${UPDATE_ID}/${CHUNK_INDEX}"

          echo "Creating branch: $BRANCH"

          git switch -c "$BRANCH"

          mkdir -p "chunks/${UPDATE_ID}"

          printf '%s' "$CHUNK" > "chunks/${UPDATE_ID}/${CHUNK_INDEX}.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "chunks/${UPDATE_ID}/${CHUNK_INDEX}.txt"

          git commit -m "Save ICS chunk ${CHUNK_INDEX} of ${TOTAL_CHUNKS}"

          git push origin "$BRANCH"

          echo "Chunk saved successfully."
